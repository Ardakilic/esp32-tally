name: Build firmwares and publish release

# Same Docker builds as the Makefile (`make plain`, `make esphome`), on every
# push to main and every PR. The build job is read-only; only the publish job
# (on main) can write, and it updates the rolling `latest` release in place —
# the release is never deleted, so the landing page's direct-download links
# (index.html, generated from case/generate.py) keep working mid-publish.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-release  # serialize: two runs must not publish at once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build plain firmware (as `make plain` does)
        run: |
          docker build -t esp32-tally-plain firmware/plain
          docker run --rm -v "$PWD":/app -w /app/firmware/plain esp32-tally-plain pio run
          mkdir -p dist
          cp firmware/plain/.pio/build/supermini/firmware.factory.bin dist/tally-plain.factory.bin

      - name: Compile ESPHome firmware (as `make esphome` does)
        run: |
          # CI has no real secrets: build with the example file, patched with a
          # throwaway API key (the validator rejects the all-zeros placeholder).
          # The released ESPHome binary therefore ships placeholder Wi-Fi/API
          # credentials — it counts standalone, Wi-Fi is set via the captive
          # portal; rebuild with your own secrets.yaml for Home Assistant.
          cp firmware/esphome/secrets.yaml.example firmware/esphome/secrets.yaml
          python3 -c "import re, secrets, base64; p = 'firmware/esphome/secrets.yaml'; s = open(p).read(); s = re.sub(r'^api_key:.*', 'api_key: \"%s\"' % base64.b64encode(secrets.token_bytes(32)).decode(), s, flags=re.M); open(p, 'w').write(s)"
          docker run --rm -v "$PWD":/app -w /app/firmware/esphome ghcr.io/esphome/esphome:2026.9.1 compile tally.yaml
          cp firmware/esphome/.esphome/build/tally/build/firmware.factory.bin dist/tally-esphome.factory.bin
          cp firmware/esphome/.esphome/build/tally/build/firmware.ota.bin dist/tally-esphome.ota.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # update the `latest` release only; the build above is read-only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-dist
          path: dist/

      - name: Publish to rolling `latest` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A stale queued run must not publish over a newer commit's release.
          test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$GITHUB_SHA"
          cat > /tmp/notes.md <<EOF
          Prebuilt firmwares from \`main\` @ \`${GITHUB_SHA:0:12}\` — flash the \`.factory.bin\` files from a browser at https://web.esphome.io (slide switch OFF first, see README → Flashing).

          - \`tally-plain.factory.bin\`: no network, ready to use.
          - \`tally-esphome.factory.bin\` / \`.ota.bin\`: built with placeholder Wi-Fi/API credentials — counts standalone, set Wi-Fi via the captive-portal hotspot; rebuild with your own \`secrets.yaml\` for Home Assistant.
          EOF
          if gh release view latest >/dev/null 2>&1; then
            # Retain the release and swap the assets in place, then point the
            # tag at the commit that produced them.
            gh release upload latest --clobber \
              dist/tally-plain.factory.bin dist/tally-esphome.factory.bin dist/tally-esphome.ota.bin
            gh release edit latest --title "Latest firmware (main)" --notes-file /tmp/notes.md
            gh api repos/${{ github.repository }}/git/refs/tags/latest -X PATCH -f sha="$GITHUB_SHA" -f force=true --jq .ref
          else
            gh release create latest --target "$GITHUB_SHA" --title "Latest firmware (main)" --notes-file /tmp/notes.md \
              dist/tally-plain.factory.bin dist/tally-esphome.factory.bin dist/tally-esphome.ota.bin
          fi
          # Verify the published assets before finishing.
          test "$(gh release view latest --json assets --jq '[.assets[].name] | sort | join(",")')" = "tally-esphome.factory.bin,tally-esphome.ota.bin,tally-plain.factory.bin"
