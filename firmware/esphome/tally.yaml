substitutions:
  name: tally
  friendly_name: Tally Counter
  idle_sleep: 60s
  save_delay: 2s  # pause after the last click before the count is written to flash (one write per burst)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - ../common/grind_chart.h  # GRIND_CHART, grind_matches(); shared with the plain build
  on_boot:
    - script.execute: idle_timer
  on_shutdown:
    - lambda: id(oled).turn_off();

esp32:
  variant: esp32c3
  board: nologo_esp32c3_super_mini
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

# reboot_timeout 0s everywhere: the counter must keep working with no Wi-Fi/HA.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:  # reuses the api key

preferences:
  # no periodic writes; the save_later script writes once per burst, deep sleep's shutdown hook flushes a pending one
  flash_write_interval: never

globals:
  - id: count
    type: int
    restore_value: true
    update_interval: 1ms  # queue changes in RAM every loop (default 1s) so save_later syncs the newest value; no flash cost
    initial_value: "0"
  - id: combo  # true while a both-buttons reset is in progress; suppresses the ±1 on release
    type: bool
    initial_value: "false"

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 400kHz  # default 50 kHz: a 512-byte frame takes ~90 ms per click redraw

font:
  - file: "gfonts://Roboto@700"
    id: big  # the count: 20 px digits, ink rows 6..25 at baseline 26, alone or left of the labels
    size: 28
    glyphs: "0123456789"
  - file: "gfonts://Roboto@400"
    id: label  # 1-3 brew labels at a 10 px pitch: caps 7 px, ascender-to-descender ink 10 px
    size: 10
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 /-"
  - file: "gfonts://Roboto@400"
    id: label4  # 4 brew labels at an 8 px pitch: caps 6 px, ink 8 px
    size: 8
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 /-"

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: never  # redrawn only by the refresh script on a click
    lambda: |-
      // Same layout as the plain build: the count in the big font, matching GRIND_CHART names stacked to its right.
      const int big_y = 26, gap = 6;  // digit baseline (ink rows 6..25 in both branches); px between digits and labels
      const char *names[GRIND_MAX_LINES];
      int n = grind_matches(id(count), names, GRIND_MAX_LINES);
      if (n > GRIND_MAX_LINES) n = GRIND_MAX_LINES;
      if (n == 0) { it.printf(it.get_width() / 2, big_y, id(big), TextAlign::BASELINE_CENTER, "%d", id(count)); return; }
      // 3 lines of label (10 px pitch) fill the height, a 4th needs label4 (8 px). TOP aligns the ascender line;
      // X sits 3 (label) / 2 (label4) px below it, so dy puts the caps 1 px into each line: rows as the plain build.
      auto *f = n <= 3 ? id(label) : id(label4);
      int pitch = n <= 3 ? 10 : 8, dy = n <= 3 ? -2 : -1;
      char num[8];
      snprintf(num, sizeof num, "%d", id(count));
      int x1, y1, nw, lw = 0, w, h;
      it.get_text_bounds(0, 0, num, id(big), TextAlign::TOP_LEFT, &x1, &y1, &nw, &h);
      for (int i = 0; i < n; i++) {
        it.get_text_bounds(0, 0, names[i], f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        if (w > lw) lw = w;
      }
      int x0 = (it.get_width() - (nw + gap + lw)) / 2;  // digits + gap + widest label, centred as a group
      if (x0 < 0) x0 = 0;
      it.print(x0, big_y, id(big), TextAlign::BASELINE_LEFT, num);
      int top = (it.get_height() - pitch * n) / 2;  // the block of n lines is centred vertically
      for (int i = 0; i < n; i++) it.print(x0 + nw + gap, top + pitch * i + dy, f, TextAlign::TOP_LEFT, names[i]);

deep_sleep:
  id: ds
  wakeup_pin:
    number: GPIO3
    allow_other_uses: true  # shared with btn_up
    inverted: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE

script:
  - id: refresh
    then:
      - component.update: oled
      - component.update: tally_number
      - script.execute: save_later
  - id: save_later
    mode: restart  # every count change restarts the wait: one NVS write per burst
    then:
      - delay: ${save_delay}
      - lambda: global_preferences->sync();
  - id: idle_timer
    mode: restart
    then:
      - delay: ${idle_sleep}
      - if:
          condition:
            switch.is_off: keep_awake
          then:
            # C3 has no ext1: add GPIO4 as a second wake source (IDF ORs the mask; ESPHome adds GPIO3 after this)
            - lambda: esp_deep_sleep_enable_gpio_wakeup(1ULL << 4, ESP_GPIO_WAKEUP_GPIO_LOW);
            - deep_sleep.enter: ds
  - id: both_check
    mode: restart
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: btn_up
              - binary_sensor.is_on: btn_down
          then:
            - delay: 1s
            - globals.set:
                id: combo
                value: "true"
            - globals.set:
                id: count
                value: "0"
            - script.execute: refresh

binary_sensor:
  - platform: gpio
    id: btn_up
    pin:
      number: GPIO3
      allow_other_uses: true  # shared with deep_sleep wakeup_pin
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute: idle_timer
      - script.execute: both_check
    on_release:
      - script.execute: idle_timer
      - script.stop: both_check
      # millis() guard: the press that woke us from deep sleep is already ON at boot; its release must not count
      - lambda: |-
          if (!id(combo) && millis() > 1500 && id(count) < 99999) id(count)++;
          if (!id(btn_down).state) id(combo) = false;
      - script.execute: refresh
  - platform: gpio
    id: btn_down
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute: idle_timer
      - script.execute: both_check
    on_release:
      - script.execute: idle_timer
      - script.stop: both_check
      - lambda: |-
          if (!id(combo) && millis() > 1500 && id(count) > 0) id(count)--;
          if (!id(btn_up).state) id(combo) = false;
      - script.execute: refresh

number:
  - platform: template
    name: Tally Count
    id: tally_number
    min_value: 0
    max_value: 99999
    step: 1
    mode: box
    lambda: return id(count);
    set_action:
      - globals.set:
          id: count
          value: !lambda return (int) x;
      - script.execute: refresh

button:
  - platform: template
    name: Reset Tally
    on_press:
      - globals.set:
          id: count
          value: "0"
      - script.execute: refresh

switch:
  - platform: template
    name: Keep Awake
    id: keep_awake
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:  # re-arm the idle timer once OTA work is done
      - script.execute: idle_timer
