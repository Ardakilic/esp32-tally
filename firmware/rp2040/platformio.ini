[env:zero]
; maxgerhardt's platform = Arduino-Pico (earlephilhower core) for PlatformIO; the official platformio/raspberrypi
; only has the mbed core. Pinned by commit (2026-09-10, the repo's HEAD; its tags are far older)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
; the platform pins arduino-pico by git (6.1.0 + 4 docs/tools-only commits: a ~1.4 GB recursive submodule clone);
; the 6.1.0 release zip builds a byte-identical firmware for ~130 MB, which matters in volume-less CI
platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/6.1.0/rp2040-6.1.0.zip
framework = arduino
board = waveshare_rp2040_zero
; already the board's default; explicit so a platform change cannot silently swap in the mbed core
board_build.core = earlephilhower
; LittleFS partition at the end of flash for the count file (64k = smallest size). Changing it moves the FS start:
; the next boot cannot mount it, reformats, and the count is lost. UF2 uploads leave the FS untouched.
board_build.filesystem_size = 64k
monitor_speed = 115200
; pinned exact; NeoPixel drives the on-board WS2812 (GP16) for the boot blink — Arduino-Pico has no driver of its own
lib_deps =
    olikraus/U8g2@2.36.18
    adafruit/Adafruit NeoPixel@1.15.5
; ms after the last click before the count is written to flash (coalesces a burst of clicks into one LittleFS write; 0 = every click)
; -I ../plain/src: tally_logic.h (state machine + SaveDelay) is shared with the ESP32 build, not copied
; -I ../common: grind_chart.h (brew-method labels) is shared with the ESP32 and ESPHome builds
build_flags = -D SAVE_DELAY_MS=2000 -I ../plain/src -I ../common
