[env:supermini]
; pioarduino = Arduino core 3.3.x on ESP-IDF 5.5; the official platformio/espressif32 is still Arduino 2.x and has no super-mini board
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = nologo_esp32c3_super_mini
; qio default fails to boot on some clones
board_build.flash_mode = dio
monitor_speed = 115200
; pinned exact; 2.36.18 is the newest on the PlatformIO registry
lib_deps = olikraus/U8g2@2.36.18
